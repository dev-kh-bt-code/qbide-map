<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2489D8" />
  <title>qbide-map _ Hệ sinh thái qbide</title>
  <link rel="icon" type="image/png" href="img/logo2.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @keyframes lineIn{
      0% { transform:scaleX(0); }
      100% { transform:scaleX(1); }
    }
    @keyframes fromLeft{
      0% { opacity:0; transform:translateX(-90px); }
      100% { opacity:1; transform:translateX(0); }
    }
    @keyframes fromRight{
      0% { opacity:0; transform:translateX(90px); }
      100% { opacity:1; transform:translateX(0); }
    }
    @keyframes hintIn{
      0% { opacity:0; transform:translate(-50%, 15px); }
      100% { opacity:1; transform:translate(-50%, 0); }
    }
    :root{
      --blue:#2489D8;
      --blue-dark:#17679D;
      --blue-soft:#EAF4FC;
      --red:#F05A5A;
      --orange:#F4A12A;
      --ink:#18232D;
      --muted:#788692;
      --line:#DCE4EA;
      --bg:#F5F7F9;
      --white:#FFFFFF;
      --shadow:0 10px 30px rgba(24,35,45,.08);
      --radius:16px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--ink);
      background:var(--bg);
      font-family:"Be Vietnam Pro","Noto Sans",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button,input{font:inherit}
    a{color:inherit;text-decoration:none}

    /* Intro */
    .intro{
      position:fixed; inset:0; z-index:1000;
      display:grid; place-items:center;
      background:#fff;
      overflow:hidden;
      transition:0.8s cubic-bezier(.16, 1, .3, 1);
    }
    .intro.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
    .intro-core{position:relative;width:min(760px,78vw);height:160px;display:flex;align-items:center;justify-content:center}
    .intro-line{
      width:2px;height:74px;background:var(--blue);
      transform:scaleX(0);transform-origin:center;
      animation:lineIn 0s 0s cubic-bezier(.16, 1, .3, 1) forwards;
      box-shadow:0 0 0 1px rgba(36,137,216,.04);
      transition: all 1s;
    }
    .intro-img{
      position:absolute;width:30vw;height:auto;object-fit:contain;
      opacity:0;
      filter:drop-shadow(0 14px 24px rgba(24,35,45,.10));
      transition: all 1s;
    }
    
    .intro-left{right:calc(50% + 52px);transform:translateX(-90px);transition: all 0s ease}
    .intro-right{left:calc(50% + 52px);transform:translateX(90px)}
    .intro-left.show{opacity:1; transform:translateX(0); transition: all 1s ease;}
    .intro-right.show{opacity:1; transform:translateX(0); transition: all 1s ease;}
    .intro-hint{
      position:absolute;bottom:34px;left:50%;transform:translateX(-50%);
      color:#A0ABB3;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
      opacity:0;
      animation:hintIn 1s 1.2s cubic-bezier(.16, 1, .3, 1) forwards;
    }
    

    /* App shell */
    .app{min-height:100vh}
    .nav{
      position:sticky;top:0;z-index:50;
      height:64px;background:rgba(255,255,255,.96);
      border-bottom:1px solid var(--line);
      backdrop-filter:blur(12px);
    }
    .nav-inner{
      width:min(1180px,calc(100% - 28px));height:100%;margin:auto;
      display:flex;align-items:center;justify-content:space-between;gap:20px;
    }
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .brand-mark{
      width:38px;height:38px;border-radius:10px;background:rgba(197, 197, 255, 0.45);
      display:grid;place-items:center;overflow:hidden;flex:none;
      box-shadow:0 5px 14px rgba(36,137,216,.22);
    }
    .brand-mark img{width:28px;height:28px;object-fit:contain}
    .brand-title{font-size:15px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;  color:#166091}
    .brand-title span{font-weight:500;color:var(--muted)}
    .nav-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}
    .status-dot{width:7px;height:7px;border-radius:50%;background:var(--orange)}

    .main{
      width:min(1180px,calc(100% - 28px));margin:0 auto;
      padding:24px 0 60px;
    }
    .hero{
      display:flex;align-items:end;justify-content:space-between;gap:20px;
      margin:4px 0 18px;
    }
    .eyebrow{
      color:var(--blue);font-size:11px;font-weight:700;
      text-transform:uppercase;letter-spacing:.13em;margin-bottom:7px;
    }
    h1{margin:0;font-size:28px;line-height:1.18;letter-spacing:-.04em ; color:#166091}
    .hero p{margin:7px 0 0;color:var(--muted);font-size:12px}
    .count{
      flex:none;border:1px solid var(--line);background:#fff;
      border-radius:999px;padding:8px 12px;color:var(--blue-dark);
      font-size:11px;font-weight:700;
    }

    .layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px;align-items:start}
    .panel{
      background:#fff;border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);
    }

    /* Main grid */
    .directory{padding:16px}
    .toolbar{display:flex;gap:9px;margin-bottom:13px}
    .search{
      flex:1;min-width:0;height:43px;border:1px solid var(--line);border-radius:12px;
      background:#F7F9FB;padding:0 13px;outline:none;color:var(--ink);
      transition:border-color .3s cubic-bezier(.16, 1, .3, 1), box-shadow .3s cubic-bezier(.16, 1, .3, 1), background .3s cubic-bezier(.16, 1, .3, 1);
    }
    .search:focus{background:#fff;border-color:var(--blue);box-shadow:0 0 0 3px rgba(36,137,216,.10)}
    .filter{
      height:43px;padding:0 12px;border:1px solid var(--line);background:#fff;
      border-radius:12px;color:var(--blue-dark);font-weight:700;font-size:12px;cursor:pointer;
    }
    .categories{display:flex;gap:7px;overflow:auto;padding-bottom:3px;margin-bottom:14px;scrollbar-width:none}
    .categories::-webkit-scrollbar{display:none}
    .cat{
      flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;
      padding:7px 10px;color:var(--muted);font-size:11px;cursor:pointer;
      transition: background .3s cubic-bezier(.16, 1, .3, 1), color .3s cubic-bezier(.16, 1, .3, 1), border-color .3s cubic-bezier(.16, 1, .3, 1);
    }
    .cat.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}

    .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .card{
      position:relative;display:flex;flex-direction:column;min-width:0;
      border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;
      transition:transform .4s cubic-bezier(.16, 1, .3, 1), box-shadow .4s cubic-bezier(.16, 1, .3, 1), border-color .4s cubic-bezier(.16, 1, .3, 1);
    }
    .card:hover{transform:translateY(-4px);border-color:#BFD8EA;box-shadow:0 12px 28px rgba(24,35,45,.09)}
    .card-top{height:92px;background:#f3f6f841;display:grid;place-items:center;position:relative}
    .card-top img{width:100%;height:100%;object-fit:contain;z-index: 0;}
    .type{
      position:absolute;top:8px;left:8px;background:#fff;border:1px solid var(--line);
      border-radius:999px;padding:4px 7px;color:var(--blue-dark);font-size:9px;font-weight:700
    }
    .card-body{padding:11px 11px 12px;display:flex;flex-direction:column;gap:6px;flex:1; z-index: 1; background-color: rgb(255, 255, 255);background-image: blur(5px);}
    .card-title{font-size:13px;font-weight:700;line-height:1.35;letter-spacing:-.015em ; color:#166091; z-index: 1;}
    .card-desc{font-size:10px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; z-index: 1;}
    .card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:5px; z-index: 1;}
    .tag{font-size:9px;color:var(--muted);white-space:nowrap; z-index: 1;}
    .open{
      color:var(--blue);font-size:10px;font-weight:700;white-space:nowrap;
      display:inline-flex;align-items:center;gap:4px; z-index: 1;
    }
    .open::after{content:"↗";font-size:12px; z-index: 1;}
    .empty{grid-column:1/-1;text-align:center;padding:35px 10px;color:var(--muted);font-size:12px}

    /* Sidebar */
    .side{position:sticky;top:82px}
    .side-head{padding:15px 15px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
    .side-title{font-size:13px;font-weight:800; color:#166091}
    .side-label{font-size:9px;color:var(--red);font-weight:800;text-transform:uppercase;letter-spacing:.1em}
    .quick-list{padding:7px}
    .quick{
      /* Sửa dòng dưới đây: Thêm độ rộng cho cột đầu tiên (chứa số thứ tự) */
      display:grid;grid-template-columns:22px 35px minmax(0,1fr) 16px;align-items:center;gap:9px;
      padding:9px;border-radius:11px;
      transition:background .3s cubic-bezier(.16, 1, .3, 1)
    }
    .quick:hover{background:#F5F8FA}
    .quick-rank{font-size:10px;font-weight:800;color:#A0ABB3;text-align:center}
    .quick-logo{width:35px;height:35px;border-radius:9px;background:#F1F5F7;border:1px solid var(--line);display:grid;place-items:center}
    .quick-logo img{width:25px;height:25px;object-fit:contain}
    .quick-info{min-width:0}
    .quick-name{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; color:#166091}
    .quick-host{font-size:9px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .quick-go{font-size:15px;color:var(--blue);text-align:center}

    .footer{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:18px 0 32px;color:#9AA5AD;font-size:10px;text-align:center}
    .toast{
      position:fixed;left:50%;bottom:18px;z-index:80;transform:translate(-50%,20px);
      opacity:0;pointer-events:none;background:#18232D;color:#fff;border-radius:999px;
      padding:9px 13px;font-size:10px;
      transition:opacity .4s cubic-bezier(.16, 1, .3, 1), transform .4s cubic-bezier(.16, 1, .3, 1)
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    @media (max-width:980px){
      .layout{grid-template-columns:1fr}
      .side{order: -1; position: relative;top:0px}
      .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    @media (max-width:720px){
      .nav{height:58px}
      .nav-inner,.main,.footer{width:min(100% - 20px,1180px)}
      .brand-mark{width:34px;height:34px;border-radius:9px}
      .brand-mark img{width:25px;height:25px}
      .brand-title{font-size:13px}
      .nav-meta{display:none}
      .main{padding-top:18px}
      .hero{margin-bottom:13px}
      h1{font-size:22px}
      .hero p{font-size:10px}
      .count{font-size:9px;padding:7px 9px}
      .directory{padding:11px; width: 95vw;}
      .cards{grid-template-columns:repeat(1,minmax(0,1fr));gap:8px}
      .card-top{height:78px}
      
      .card-body{padding:9px}
      .card-title{font-size:11px}
      .card-desc{font-size:9px}
      .toolbar{margin-bottom:9px}
      .search,.filter{height:39px}
      .intro-img{width:40vw;height:auto}
      .intro-left{right:calc(50% + 34px)}
      .intro-right{left:calc(50% + 34px)}
      .intro-line{width:2px}
    }
    @media (max-width:430px){
      .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
      .card-top{height:72px}
      .card-desc{display:none}
      .card-foot{padding-top:1px}
      .count{display:none}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
  </style>
</head>
<body>
  <section class="intro" id="intro" aria-label="Mở đầu">
    <div class="intro-core">
      <img id="introLeft" class="intro-img intro-left" alt="" />
      <div class="intro-line"></div>
      <img id="introRight" class="intro-img intro-right" alt="" />
    </div>
    <div class="intro-hint">scroll / swipe</div>
  </section>

  <div class="app">
    <header class="nav">
      <div class="nav-inner">
        <a class="brand" href="#" aria-label="Trang chủ">
          <div class="brand-mark"><img id="brandLogo" alt="qbide" /></div>
          <div class="brand-title">qbide-map <span>_ Hệ sinh thái QBIDE</span></div>
        </a>
        <div class="nav-meta"><span class="status-dot"></span><span id="dataStatus">đang tải dữ liệu</span></div>
      </div>
    </header>

    <main class="main">
      <section class="hero">
        <div>
          <div class="eyebrow">qbide/ ecosystem map</div>
          <h1>Tất cả link cần dùng, ở một chỗ.</h1>
          <p>Tìm nhanh cổng học tập, dịch vụ, cộng đồng và các kênh chính thức.</p>
        </div>
        <div class="count" id="count">0 trang</div>
      </section>

      <section class="layout">
        <div class="panel directory">
          <div class="toolbar">
            <input id="search" class="search" type="search" placeholder="Tìm website, khoa, dịch vụ..." autocomplete="off" />
            <button id="resetBtn" class="filter" type="button">Tất cả</button>
          </div>
          <div id="categories" class="categories"></div>
          <div id="cards" class="cards"></div>
        </div>

        <aside class="panel side" aria-label="Trang truy cập nhiều">
          <div class="side-head">
            <div class="side-title">Truy cập nhiều</div>
            <div class="side-label">local stats</div>
          </div>
          <div id="quickList" class="quick-list"></div>
        </aside>
      </section>
    </main>
    <footer class="footer">qbide-map</footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const state = {
      data: null,
      category: "Tất cả",
      query: ""
    };

    const $ = (selector) => document.querySelector(selector);

    async function loadData(){
      try{
        const res = await fetch("./data.json", {cache:"no-store"});
        if(!res.ok) throw new Error("Không thể tải data.json");
        state.data = await res.json();
        hydrateIntro();
        render();
        $("#dataStatus").textContent = `${state.data.websites.length} liên kết`;
      }catch(err){
        console.error(err);
        $("#dataStatus").textContent = "không tải được data.json";
        $("#cards").innerHTML = `<div class="empty">Không đọc được <strong>data.json</strong>.<br>Hãy mở project bằng Live Server / local server thay vì mở file HTML trực tiếp.</div>`;
      }
    }

    function hydrateIntro(){
      const intro = state.data.intro || {};
      $("#brandLogo").src = intro.logo || "";
      $("#introLeft").src = intro.leftImage || intro.logo || "";
      $("#introRight").src = intro.rightImage || intro.logo || "";
      $("#introLeft").classList.add("show");
      $("#introRight").classList.add("show");
    }

    function getStats(){
      try{return JSON.parse(localStorage.getItem("qbide-map-stats") || "{}")}catch{return {}}
    }
    function saveStats(stats){
      localStorage.setItem("qbide-map-stats", JSON.stringify(stats));
    }
    function registerVisit(id){
      const stats = getStats();
      stats[id] = (stats[id] || 0) + 1;
      saveStats(stats);
      renderQuick();
    }

    function getCategories() {
  const categories = [
    ...new Set(
      state.data.websites
        .flatMap(x => x.tags || [])
        .filter(Boolean)
    )
  ];

  return ["Tất cả", ...categories];
}

    function renderCategories(){
      const wrap = $("#categories");
      wrap.innerHTML = getCategories().map(cat => `
        <button class="cat ${state.category === cat ? "active" : ""}" data-category="${escapeAttr(cat)}">${escapeHtml(cat)}</button>
      `).join("");
      wrap.querySelectorAll(".cat").forEach(btn => {
        btn.addEventListener("click", () => {
          state.category = btn.dataset.category;
          render();
        });
      });
    }

    function filteredSites() {
  const q = state.query.trim().toLowerCase();

  return state.data.websites.filter(site => {
    const tagOK =
      state.category === "Tất cả" ||
      (site.tags || []).includes(state.category);

    const haystack = [
      site.title,
      site.description,
      site.host,
      ...(site.tags || [])
    ].join(" ").toLowerCase();

    return tagOK && (!q || haystack.includes(q));
  });
}
    function render(){
      if(!state.data) return;
      renderCategories();
      const sites = filteredSites();
      $("#count").textContent = `${sites.length} trang`;
      $("#cards").innerHTML = sites.length ? sites.map(cardTemplate).join("") :
        `<div class="empty">Không tìm thấy website phù hợp.</div>`;
      $("#cards").querySelectorAll(".card").forEach(card => {
        card.addEventListener("click", () => registerVisit(card.dataset.id));
      });
      renderQuick();
    }

    function cardTemplate(site){
      return `
        <a class="card" data-id="${escapeAttr(site.id)}" href="${escapeAttr(site.url)}" target="_blank" rel="noopener noreferrer">
          <div class="card-top">
            <span class="type">${escapeHtml(site.category || "WEB")}</span>
            <img src="${escapeAttr(site.image)}" alt="" loading="lazy" onerror="this.style.opacity='.35';" />
          </div>
          <div class="card-body">
            <div class="card-title">${escapeHtml(site.title)}</div>
            <div class="card-desc">${escapeHtml(site.description || "")}</div>
            <div class="card-foot">
              <span class="tag">${escapeHtml(site.host || new URL(site.url).hostname)}</span>
              <span class="open">Mở</span>
            </div>
          </div>
        </a>
      `;
    }

    function renderQuick(){
      if(!state.data) return;
      const stats = getStats();
      const top = [...state.data.websites]
        .sort((a,b) => (stats[b.id] || 0) - (stats[a.id] || 0))
        .slice(0,5);

      $("#quickList").innerHTML = top.map((site,i) => `
        <a class="quick" href="${escapeAttr(site.url)}" target="_blank" rel="noopener noreferrer" data-id="${escapeAttr(site.id)}">
          <div class="quick-rank">${String(i+1).padStart(2,"0")}</div>
          <div class="quick-logo"><img src="${escapeAttr(site.image)}" alt="" loading="lazy"></div>
          <div class="quick-info">
            <div class="quick-name">${escapeHtml(site.title)}</div>
            <div class="quick-host">${escapeHtml(site.host || "")}</div>
          </div>
          <div class="quick-go">›</div>
        </a>
      `).join("");

      $("#quickList").querySelectorAll(".quick").forEach(el => {
        el.addEventListener("click", () => registerVisit(el.dataset.id));
      });
    }

    function escapeHtml(value){
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[c]));
    }
    function escapeAttr(value){return escapeHtml(value).replace(/`/g,"&#096;")}

    // Intro: scroll/swipe as a single presentation-like transition.
    let introDismissed = false;
    function dismissIntro(){
      if(introDismissed) return;
      introDismissed = true;
      $("#intro").classList.add("is-hidden");
      setTimeout(() => $("#intro").remove(), 800);
      window.scrollTo({top:0, behavior:"auto"});
    }
    window.addEventListener("wheel", e => {
      if(!introDismissed && Math.abs(e.deltaY) > 4) dismissIntro();
    }, {passive:true});
    window.addEventListener("touchstart", e => {
      window.__touchY = e.touches[0].clientY;
    }, {passive:true});
    window.addEventListener("touchmove", e => {
      if(!introDismissed && window.__touchY - e.touches[0].clientY > 8) dismissIntro();
    }, {passive:true});
    window.addEventListener("keydown", e => {
      if(!introDismissed && ["ArrowDown","PageDown"," ","Enter"].includes(e.key)) dismissIntro();
    });

    $("#search").addEventListener("input", e => {
      state.query = e.target.value;
      render();
    });
    $("#resetBtn").addEventListener("click", () => {
      state.category = "Tất cả";
      state.query = "";
      $("#search").value = "";
      render();
    });

    loadData();
  </script>
</body>
</html>
